name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-serve.txt pytest httpx
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t mcsr-serving .
      - run: docker run -d --name api -p 8000:8000 mcsr-serving
      - name: wait for the API to come up
        run: |
          for i in $(seq 30); do
            curl -sf localhost:8000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
      - name: predict one match
        run: |
          curl -sf localhost:8000/predict \
            -H 'content-type: application/json' \
            -d @examples/match.json | tee response.json
          python3 -c "import json; m = json.load(open('response.json'))['minutes']; assert 3 < m < 60, m"
